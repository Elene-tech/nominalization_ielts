<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Lab — Граматика для IELTS Writing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6faec;
  --surface:#ffffff;
  --surface-2:#fef9c3;
  --surface-3:#ecfccb;
  --text:#14301c;
  --muted:#5c6b58;
  --accent:#16a34a;
  --accent-dark:#14532d;
  --lime:#a3e635;
  --lime-deep:#65a30d;
  --yellow:#facc15;
  --yellow-deep:#eab308;
  --accent-soft:rgba(163,230,53,.28);
  --line:#cfe3b8;
  --ok:#15803d;
  --ok-bg:#dcfce7;
  --ok-line:#86efac;
  --bad:#dc2626;
  --bad-bg:#fee2e2;
  --bad-line:#fca5a5;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--yellow);color:var(--accent-dark)}

/* ---------- Layout ---------- */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:272px;flex:0 0 272px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid var(--line);
  padding:32px 24px 40px;
  background:linear-gradient(180deg,#ecfccb 0%,var(--bg) 220px);
}
.main{flex:1;min-width:0;padding:0 56px 110px}
.content{max-width:780px;margin:0 auto}

/* ---------- Sidebar ---------- */
.brand{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.15;display:block;text-decoration:none;color:var(--accent-dark)}
.brand span{color:var(--lime-deep)}
.brand-sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-weight:600}
.nav-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime-deep);margin:30px 0 8px;font-weight:700}
.nav a{
  display:flex;align-items:baseline;gap:9px;
  padding:7px 10px;margin:1px -10px;
  border-radius:9px;text-decoration:none;color:var(--text);
  font-size:14.5px;line-height:1.35;
  transition:background .18s ease;
}
.nav a:hover{background:var(--accent-soft)}
.nav a.active{background:var(--accent-dark);color:#fefce8}
.nav a .num{font-family:var(--serif);font-size:12.5px;color:var(--lime-deep);min-width:20px;font-weight:700}
.nav a.active .num{color:var(--yellow)}
.nav a .dot{margin-left:auto;font-size:11px;color:var(--accent);opacity:0}
.nav a .dot.on{opacity:1}
.nav a.active .dot{color:var(--lime)}
.side-progress{margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.side-progress .label{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600}
.reset-btn{
  margin-top:16px;background:none;border:none;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;color:var(--muted);
  text-decoration:underline;text-underline-offset:3px;padding:0;
}
.reset-btn:hover{color:var(--bad)}

/* ---------- Progress bars ---------- */
.pbar{height:8px;background:#e4f2cf;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--accent));border-radius:99px;width:0;transition:width .5s cubic-bezier(.19,1,.22,1)}

/* ---------- Hero / home ---------- */
.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--lime-deep);font-weight:800}
.hero{padding:74px 0 46px;border-bottom:2px solid var(--line);margin-bottom:44px}
.hero h1{
  font-family:var(--serif);font-weight:700;
  font-size:clamp(40px,5.6vw,60px);line-height:1.08;
  margin:14px 0 20px;letter-spacing:-.01em;color:var(--accent-dark);
}
.hero h1 em{font-style:italic;color:var(--accent);background:linear-gradient(transparent 62%,var(--yellow) 62%);padding:0 4px}
.hero p.lead{font-size:17.5px;color:var(--muted);max-width:620px}
.hero-stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.stat{border:2px solid var(--line);border-radius:99px;padding:7px 16px;font-size:13.5px;background:var(--surface);font-weight:600}
.stat b{font-family:var(--serif);color:var(--accent);margin-right:5px;font-size:16px}
.overall{margin-top:34px;max-width:460px}
.overall .label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{
  display:block;text-decoration:none;color:var(--text);
  background:var(--surface);border:2px solid var(--line);border-radius:16px;
  padding:22px 22px 18px;position:relative;
  transition:transform .25s cubic-bezier(.19,1,.22,1),border-color .25s,box-shadow .25s;
}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 28px rgba(20,83,45,.13)}
.card .num{font-family:var(--serif);font-size:13px;color:var(--lime-deep);font-weight:700}
.card h3{font-family:var(--serif);font-size:20px;font-weight:700;margin:6px 0 2px;line-height:1.25;color:var(--accent-dark)}
.card .ru{font-size:13.5px;color:var(--muted)}
.card .tags{display:flex;gap:6px;margin:12px 0 12px;flex-wrap:wrap}
.tag{
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  border:1.5px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);
}
.tag.t1{color:var(--accent-dark);border-color:var(--accent);background:var(--ok-bg)}
.tag.t2{color:#854d0e;border-color:var(--yellow-deep);background:var(--surface-2)}
.card .pbar{margin-top:4px}
.card .pct{font-size:11.5px;color:var(--muted);margin-top:6px;display:block;font-weight:600}
.card.exam{background:var(--accent-dark);color:#fefce8;border-color:var(--accent-dark)}
.card.exam h3{color:var(--yellow)}
.card.exam .ru{color:var(--lime)}
.card.exam .num{color:var(--lime)}
.card.exam .tag{border-color:rgba(250,204,21,.5);color:var(--yellow);background:transparent}
.card.exam .pbar{background:rgba(254,252,232,.18);border-color:transparent}

/* ---------- Module page ---------- */
.mod-head{padding:60px 0 32px;border-bottom:2px solid var(--line);margin-bottom:40px}
.mod-head h1{font-family:var(--serif);font-size:clamp(32px,4.4vw,44px);font-weight:700;line-height:1.12;margin:12px 0 6px;color:var(--accent-dark)}
.mod-head .ru{font-size:17px;color:var(--lime-deep);font-family:var(--serif);font-style:italic;font-weight:700}
.mod-meta{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.mod-progress{display:flex;align-items:center;gap:12px;margin-top:22px;max-width:420px}
.mod-progress .pbar{flex:1}
.mod-progress .pct{font-size:13px;color:var(--muted);white-space:nowrap;font-weight:600}
.level{display:inline-flex;gap:3px;align-items:center}
.level i{width:8px;height:8px;border-radius:99px;background:#e4f2cf;border:1.5px solid var(--line)}
.level i.on{background:var(--yellow);border-color:var(--yellow-deep)}

section.block{margin-bottom:52px}
h2.sec{
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
  font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:14px;
}
h2.sec::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--lime),transparent)}
.theory p{margin-bottom:14px;max-width:68ch}
.theory ul{margin:0 0 14px 20px;max-width:64ch}
.theory li{margin-bottom:7px}
.formula{
  background:var(--surface-2);border:2px solid var(--yellow-deep);border-radius:12px;
  padding:16px 20px;margin:18px 0;
  font-family:var(--serif);font-size:17px;line-height:1.7;
}
.formula b{color:var(--accent-dark);background:var(--yellow);border-radius:4px;padding:0 4px}
.warn{
  border-left:4px solid var(--yellow-deep);background:#fefce8;
  padding:13px 18px;border-radius:0 12px 12px 0;margin:18px 0;font-size:14.5px;
}
.warn b{color:#854d0e}

.ex-list{display:flex;flex-direction:column}
.ex-item{padding:20px 0;border-bottom:1px solid var(--line)}
.ex-item:last-child{border-bottom:none}
.ex-item .src{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime-deep);margin-bottom:6px;font-weight:800}
.ex-item .en{font-family:var(--serif);font-size:19.5px;line-height:1.5}
.ex-item .ru{font-size:14px;color:var(--muted);margin-top:6px}
.ex-item .why{font-size:13.5px;color:var(--accent-dark);margin-top:8px;font-weight:500}
.ex-item .why::before{content:"Навіщо це екзаменатору — ";color:var(--muted);font-weight:700}
.hl{background:var(--yellow);border-radius:4px;padding:1px 4px;box-shadow:inset 0 -2px 0 var(--lime);font-weight:600}
.hl b,.hl strong{font-weight:700}

/* ---------- Exercises ---------- */
.exercise{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:22px}
.exercise .ex-title{font-family:var(--serif);font-size:18.5px;font-weight:700;margin-bottom:4px;color:var(--accent-dark)}
.exercise .ex-instr{font-size:14px;color:var(--muted);margin-bottom:18px}
.item{padding:16px 0;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:none;padding-top:4px}
.item .q{font-size:15px;margin-bottom:12px;line-height:1.6}
.item .q .src-sentence{font-family:var(--serif);font-size:17px;display:block;margin:6px 0}
.item .q .task-line{color:var(--lime-deep);font-size:14px;display:block;margin-top:4px;font-weight:700}
.item .num{font-family:var(--serif);color:var(--accent);margin-right:8px;font-weight:700}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;
  padding:11px 15px;font-family:var(--serif);font-size:15.5px;line-height:1.45;color:var(--text);
  cursor:pointer;transition:border-color .15s,background .15s;width:100%;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--surface-3)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

.gap-line{font-family:var(--serif);font-size:17.5px;line-height:2.3}
.gap-input{
  font-family:var(--serif);font-size:16.5px;color:var(--text);
  border:none;border-bottom:3px solid var(--yellow-deep);background:var(--surface-2);
  min-width:130px;max-width:220px;padding:2px 8px;margin:0 4px;text-align:center;outline:none;
  border-radius:6px 6px 0 0;font-weight:600;
}
.gap-input:focus{border-bottom-color:var(--accent);background:var(--surface-3)}
.gap-input.ok{border-bottom-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.gap-input.bad{border-bottom-color:var(--bad);color:var(--bad);background:var(--bad-bg)}

textarea.answer{
  width:100%;min-height:74px;resize:vertical;
  border:2px solid var(--line);border-radius:10px;background:var(--bg);
  font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--text);
  padding:12px 14px;outline:none;
}
textarea.answer:focus{border-color:var(--accent);background:#fff}

.feedback{font-size:14px;margin-top:10px;border-radius:10px;padding:10px 14px;display:none;font-weight:500}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:2px solid var(--ok-line);font-weight:700}
.feedback.bad{background:var(--bad-bg);color:var(--bad);border:2px solid var(--bad-line);font-weight:700}
.feedback .why-line{color:var(--text);margin-top:5px;display:block;font-weight:400}
.model{
  display:none;margin-top:10px;background:var(--surface-2);border:2px solid var(--yellow-deep);border-radius:10px;
  padding:12px 16px;font-size:14.5px;
}
.model.show{display:block}
.model .m-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#854d0e;font-weight:800;display:block;margin-bottom:4px}
.model .m-text{font-family:var(--serif);font-size:16.5px}

.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{
  font-family:var(--sans);font-size:13.5px;font-weight:700;
  background:var(--accent-dark);color:#fefce8;border:none;border-radius:99px;
  padding:10px 24px;cursor:pointer;transition:background .18s,transform .18s;
}
.btn:hover{background:var(--accent);transform:translateY(-1px)}
.btn-ghost{
  font-family:var(--sans);font-size:13.5px;font-weight:700;
  background:none;color:var(--accent-dark);border:2px solid var(--line);border-radius:99px;
  padding:8px 20px;cursor:pointer;transition:border-color .18s,color .18s,background .18s;
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--surface-3)}

.production{background:var(--surface-3);border:2px solid var(--lime);border-radius:16px;padding:26px 28px}
.production .p-task{margin-bottom:18px}
.production .p-task:last-child{margin-bottom:0}
.production .p-label{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--lime-deep);margin-bottom:6px}
.production .p-text{font-size:15px;margin-bottom:10px}

/* ---------- Topbar (mobile) ---------- */
.topbar{
  display:none;position:sticky;top:0;z-index:50;
  background:var(--bg);border-bottom:2px solid var(--line);
  padding:14px 20px;align-items:center;justify-content:space-between;
}
.topbar .brand{font-size:20px}
.burger{background:var(--accent-dark);color:#fefce8;border:none;border-radius:9px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:700;font-family:var(--sans)}

@media(max-width:960px){
  .sidebar{
    position:fixed;z-index:60;left:0;top:0;bottom:0;height:auto;
    transform:translateX(-100%);transition:transform .3s cubic-bezier(.19,1,.22,1);
    width:300px;flex:none;box-shadow:0 0 60px rgba(20,48,28,.2);
  }
  .sidebar.open{transform:translateX(0)}
  .topbar{display:flex}
  .main{padding:0 22px 90px}
  .cards{grid-template-columns:1fr}
  .hero{padding:44px 0 36px}
}
.footnote{margin-top:70px;padding-top:24px;border-top:2px solid var(--line);font-size:13px;color:var(--muted)}
.footnote a{color:var(--accent);font-weight:600}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="#/">Grammar<span>Lab</span></a>
  <button class="burger" id="burger">Зміст</button>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">Grammar<span>Lab</span></a>
    <div class="brand-sub">IELTS Writing · Тренажер</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-progress">
      <div class="label"><span>Загальний прогрес</span><span id="sidePct">0%</span></div>
      <div class="pbar"><i id="sideBar"></i></div>
      <button class="reset-btn" id="resetBtn">Скинути весь прогрес</button>
    </div>
  </aside>
  <main class="main"><div class="content" id="app"></div></main>
</div>

<script>
/* ============================================================
   Grammar Lab — engine
   ============================================================ */
const STORE_KEY = "grammarlab-progress-v1";

function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveStore(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
let store = loadStore();
function markDone(key){
  if(!store[key]){ store[key] = 1; saveStore(store); refreshProgress(); }
}
function isDone(key){ return !!store[key]; }

function norm(s){
  return (s||"").toLowerCase()
    .replace(/[.,!?;:"“”‘’()«»\[\]—–-]/g," ")
    .replace(/[’']/g,"")
    .replace(/\s+/g," ").trim();
}
function containsKw(text, kw){
  kw = norm(kw);
  if(!kw) return false;
  const re = new RegExp("(^| )" + kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/ /g,"\\s+") + "( |$)");
  return re.test(" " + text + " ");
}

/* ---------- shared renderers ---------- */
function tagChips(m){
  let t = "";
  if(m.tags.includes("T1")) t += '<span class="tag t1">Task 1</span>';
  if(m.tags.includes("T2")) t += '<span class="tag t2">Task 2</span>';
  let dots = '<span class="level" title="Складність">';
  for(let i=1;i<=3;i++) dots += '<i class="' + (i<=m.level ? "on" : "") + '"></i>';
  dots += "</span>";
  return t + dots;
}

function itemKey(prefix, exI, itI){ return prefix + ":" + exI + ":" + itI; }

function countItems(prefix, exercises){
  let total = 0, done = 0;
  exercises.forEach((ex, exI) => {
    ex.items.forEach((_, itI) => {
      total++;
      if(isDone(itemKey(prefix, exI, itI))) done++;
    });
  });
  return {total, done};
}

/* ---------- exercise HTML ---------- */
function renderExercise(prefix, ex, exI){
  let h = '<div class="exercise">';
  h += '<div class="ex-title">' + ex.title + "</div>";
  h += '<div class="ex-instr">' + ex.instruction + "</div>";

  ex.items.forEach((it, itI) => {
    const key = itemKey(prefix, exI, itI);
    h += '<div class="item" data-key="' + key + '">';
    h += '<div class="q"><span class="num">' + (itI+1) + ".</span>";

    if(ex.type === "choice"){
      h += it.q + "</div>";
      h += '<div class="opts">';
      it.opts.forEach((op, oI) => {
        h += '<button class="opt" data-ex="' + exI + '" data-it="' + itI + '" data-o="' + oI + '">' + op + "</button>";
      });
      h += "</div>";
      h += '<div class="feedback" id="fb-' + key + '"></div>';
    }

    if(ex.type === "gap"){
      h += '<div class="gap-line">' + it.pre +
           '<input class="gap-input" id="in-' + key + '" placeholder="…" autocomplete="off" spellcheck="false">' +
           it.post + "</div></div>";
      h += '<div class="feedback" id="fb-' + key + '"></div>';
    }

    if(ex.type === "transform"){
      h += '<span class="src-sentence">' + it.src + "</span>";
      h += '<span class="task-line">→ ' + it.task + "</span></div>";
      h += '<textarea class="answer" id="ta-' + key + '" placeholder="Ваш варіант…"></textarea>';
      h += '<div class="feedback" id="fb-' + key + '"></div>';
      h += '<div class="model" id="md-' + key + '"><span class="m-label">Зразкова відповідь</span><span class="m-text">' + it.model + "</span></div>";
    }
    h += "</div>";
  });

  if(ex.type === "gap"){
    h += '<div class="actions"><button class="btn" data-check-gap="' + exI + '">Перевірити</button></div>';
  }
  if(ex.type === "transform"){
    h += '<div class="actions">' +
         '<button class="btn" data-check-tr="' + exI + '">Перевірити</button>' +
         '<button class="btn-ghost" data-show-models="' + exI + '">Показати зразки</button></div>';
  }
  h += "</div>";
  return h;
}

/* ---------- exercise binding ---------- */
function bindExercises(root, prefix, exercises){
  /* choice */
  root.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => {
      const exI = +btn.dataset.ex, itI = +btn.dataset.it, oI = +btn.dataset.o;
      const ex = exercises[exI], it = ex.items[itI];
      const key = itemKey(prefix, exI, itI);
      const fb = root.querySelector("#fb-" + CSS.escape(key));
      const opts = btn.parentElement.querySelectorAll(".opt");
      if(oI === it.a){
        opts.forEach(o => o.disabled = true);
        btn.classList.add("correct");
        fb.className = "feedback show ok";
        fb.innerHTML = "Правильно!" + (it.why ? '<span class="why-line">' + it.why + "</span>" : "");
        markDone(key);
      } else {
        btn.classList.add("wrong");
        btn.disabled = true;
        fb.className = "feedback show bad";
        fb.innerHTML = "Не зовсім. Спробуйте ще раз." + (it.why ? '<span class="why-line">' + it.why + "</span>" : "");
      }
    });
  });

  /* gap */
  root.querySelectorAll("[data-check-gap]").forEach(btn => {
    btn.addEventListener("click", () => {
      const exI = +btn.dataset.checkGap;
      const ex = exercises[exI];
      ex.items.forEach((it, itI) => {
        const key = itemKey(prefix, exI, itI);
        const inp = root.querySelector("#in-" + CSS.escape(key));
        const fb = root.querySelector("#fb-" + CSS.escape(key));
        const val = norm(inp.value);
        const ok = it.acc.some(a => containsKw(val, a) || val === norm(a));
        inp.classList.remove("ok","bad");
        if(ok){
          inp.classList.add("ok");
          fb.className = "feedback show ok";
          fb.innerHTML = "Правильно!" + (it.why ? '<span class="why-line">' + it.why + "</span>" : "");
          markDone(key);
        } else {
          inp.classList.add("bad");
          fb.className = "feedback show bad";
          fb.innerHTML = "Поки що невірно. Підказка: " + it.hint +
            (it.why ? '<span class="why-line">' + it.why + "</span>" : "");
        }
      });
    });
  });

  /* transform — check */
  root.querySelectorAll("[data-check-tr]").forEach(btn => {
    btn.addEventListener("click", () => {
      const exI = +btn.dataset.checkTr;
      const ex = exercises[exI];
      ex.items.forEach((it, itI) => {
        const key = itemKey(prefix, exI, itI);
        const ta = root.querySelector("#ta-" + CSS.escape(key));
        const fb = root.querySelector("#fb-" + CSS.escape(key));
        const val = norm(ta.value);
        if(!val){
          fb.className = "feedback show bad";
          fb.innerHTML = "Напишіть свій варіант речення.";
          return;
        }
        const missing = it.req.filter(g => !g.any.some(k => containsKw(val, k)));
        if(missing.length === 0){
          fb.className = "feedback show ok";
          fb.innerHTML = "Чудово — структуру використано правильно! Порівняйте зі зразком нижче." +
            (it.why ? '<span class="why-line">' + it.why + "</span>" : "");
          root.querySelector("#md-" + CSS.escape(key)).classList.add("show");
          markDone(key);
        } else {
          fb.className = "feedback show bad";
          fb.innerHTML = "Структура поки неповна. Перевірте: " +
            missing.map(g => g.hint).join("; ") + ".";
        }
      });
    });
  });

  /* transform — show models */
  root.querySelectorAll("[data-show-models]").forEach(btn => {
    btn.addEventListener("click", () => {
      const exI = +btn.dataset.showModels;
      exercises[exI].items.forEach((it, itI) => {
        const key = itemKey(prefix, exI, itI);
        root.querySelector("#md-" + CSS.escape(key)).classList.add("show");
        markDone(key);
      });
    });
  });

  /* production reveals */
  root.querySelectorAll("[data-reveal]").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = root.querySelector("#" + btn.dataset.reveal);
      t.classList.toggle("show");
      btn.textContent = t.classList.contains("show") ? "Сховати зразок" : "Показати зразок";
    });
  });
}

/* ---------- module / exam pages ---------- */
function renderModule(m){
  const prefix = "m:" + m.id;
  const c = countItems(prefix, m.exercises);
  const pct = c.total ? Math.round(c.done / c.total * 100) : 0;

  let h = '<header class="mod-head">';
  h += '<div class="kicker">Модуль ' + m.num + " · Граматика для Writing</div>";
  h += "<h1>" + m.en + "</h1>";
  h += '<div class="ru">' + m.ru + "</div>";
  h += '<div class="mod-meta">' + tagChips(m) + "</div>";
  h += '<div class="mod-progress"><div class="pbar"><i style="width:' + pct + '%"></i></div><span class="pct">' + c.done + " / " + c.total + " завдань</span></div>";
  h += "</header>";

  h += '<section class="block"><h2 class="sec">Теорія</h2><div class="theory">' + m.theory + "</div></section>";

  h += '<section class="block"><h2 class="sec">Приклади в контексті IELTS</h2><div class="ex-list">';
  m.examples.forEach(e => {
    h += '<div class="ex-item"><div class="src">' + e.src + "</div>" +
         '<div class="en">' + e.en + "</div>" +
         (e.ru ? '<div class="ru">' + e.ru + "</div>" : "") +
         '<div class="why">' + e.why + "</div></div>";
  });
  h += "</div></section>";

  h += '<section class="block"><h2 class="sec">Практика</h2>';
  m.exercises.forEach((ex, exI) => { h += renderExercise(prefix, ex, exI); });
  h += "</section>";

  h += '<section class="block"><h2 class="sec">Ваш хід</h2><div class="production">';
  m.production.forEach((p, pI) => {
    const rid = "prod-" + m.id + "-" + pI;
    h += '<div class="p-task"><div class="p-label">' + p.label + "</div>" +
         '<div class="p-text">' + p.prompt + "</div>" +
         '<textarea class="answer" placeholder="Напишіть тут своє речення…"></textarea>' +
         '<div class="actions"><button class="btn-ghost" data-reveal="' + rid + '">Показати зразок</button></div>' +
         '<div class="model" id="' + rid + '"><span class="m-label">Один із можливих варіантів</span><span class="m-text">' + p.model + "</span></div></div>";
  });
  h += "</div></section>";

  h += '<div class="footnote">Готово? Поверніться до <a href="#/">змісту</a> або пройдіть <a href="#/exam">фінальний тренінг</a>.</div>';
  return h;
}

function renderExam(){
  const prefix = "x";
  const c = countItems(prefix, EXAM.exercises);
  const pct = c.total ? Math.round(c.done / c.total * 100) : 0;
  let h = '<header class="mod-head">';
  h += '<div class="kicker">Фінальний тренінг · Exam Simulation</div>';
  h += "<h1>Усі структури разом</h1>";
  h += '<div class="ru">Змішані завдання формату IELTS Writing — тут уже немає підказок, яку структуру використовувати. Обирайте самі.</div>';
  h += '<div class="mod-progress"><div class="pbar"><i style="width:' + pct + '%"></i></div><span class="pct">' + c.done + " / " + c.total + " завдань</span></div>";
  h += "</header>";
  h += '<section class="block">';
  EXAM.exercises.forEach((ex, exI) => { h += renderExercise(prefix, ex, exI); });
  h += "</section>";
  h += '<div class="footnote">Чудова робота! Поверніться до <a href="#/">змісту</a>, щоб повторити окремі теми.</div>';

/* ---------- home ---------- */
function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function renderHome(){

    h += '<a class="card" href="#/m/' + m.id + '">';
    h += '<span class="num">Модуль ' + m.num + "</span>";
    h += "<h3>" + m.en + "</h3>";
    h += '<span class="ru">' + m.ru + "</span>";
    h += '<div class="tags">' + tagChips(m) + "</div>";
    h += '<div class="pbar"><i style="width:' + pct + '%"></i></div>';
    h += '<span class="pct">' + (pct === 100 ? "Пройдено" : c.done + " / " + c.total) + "</span>";
    h += "</a>";
  });

  h += '<span class="pct">' + (epct === 100 ? "Пройдено" : ec.done + " / " + ec.total) + "</span>";
  h += "</a>";
  h += "</div>";
  h += '<div class="footnote">Порада: проходьте модулі по порядку — кожен наступний спирається на попередні. Прогрес зберігається автоматично у вашому браузері.</div>';
  return h;
}

/* ---------- progress ---------- */
function totalProgress(){
  let total = 0, done = 0;
  MODULES.forEach(m => {
    const c = countItems("m:" + m.id, m.exercises);
    total += c.total; done += c.done;
  });
  const ec = countItems("x", EXAM.exercises);
  total += ec.total; done += ec.done;
  return {total, done, pct: total ? Math.round(done/total*100) : 0};
}
function refreshProgress(){
  const all = totalProgress();
  document.getElementById("sidePct").textContent = all.pct + "%";
  document.getElementById("sideBar").style.width = all.pct + "%";
  document.querySelectorAll("#nav a .dot").forEach(d => {
    const id = d.dataset.mod;
    if(!id) return;
    const m = MODULES.find(x => x.id === id);
    const c = countItems("m:" + id, m.exercises);
    d.classList.toggle("on", c.done === c.total && c.total > 0);
  });
}

/* ---------- nav ---------- */
function buildNav(){
  const nav = document.getElementById("nav");
  let h = '<div class="nav-label">Почати</div>';
  h += '<a href="#/" data-route="home"><span class="num">→</span>Огляд курсу</a>';
  h += '<div class="nav-label">Модулі</div>';
  MODULES.forEach(m => {
    h += '<a href="#/m/' + m.id + '" data-route="' + m.id + '">' +
         '<span class="num">' + String(m.num).padStart(2,"0") + "</span>" +
         "<span>" + m.en + "</span>" +
         '<span class="dot" data-mod="' + m.id + '">●</span></a>';
  });
  h += '<div class="nav-label">Перевірка</div>';
  h += '<a href="#/exam" data-route="exam"><span class="num">★</span>Фінальний тренінг</a>';
  nav.innerHTML = h;
}
function setActiveNav(route){
  document.querySelectorAll("#nav a").forEach(a => {
    a.classList.toggle("active", a.dataset.route === route);
  });
}

/* ---------- router ---------- */
function route(){
  const hash = location.hash || "#/";
  const app = document.getElementById("app");
  let r = "home";
  if(hash.startsWith("#/m/")){
    const id = hash.slice(4);
    const m = MODULES.find(x => x.id === id);
    if(m){ app.innerHTML = renderModule(m); bindExercises(app, "m:" + m.id, m.exercises); r = id; }
    else app.innerHTML = renderHome();
  } else if(hash === "#/exam"){
    app.innerHTML = renderExam(); bindExercises(app, "x", EXAM.exercises); r = "exam";
  } else {
    app.innerHTML = renderHome();
  }
  setActiveNav(r);
  refreshProgress();
  window.scrollTo(0,0);
  document.getElementById("sidebar").classList.remove("open");
}
window.addEventListener("hashchange", route);

document.getElementById("burger").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if(confirm("Скинути весь прогрес у всіх модулях?")){
    store = {}; saveStore(store); route();
  }
});

{
  id:"nominalization", num:3, en:"Nominalization", ru:"Номіналізація", tags:["T1","T2"], level:2,
  theory:
  "<p>Номіналізація — це перетворення дієслова або прикметника на <b>іменник</b>: rise → <b>a rise</b>, develop → <b>development</b>, efficient → <b>efficiency</b>. Це головний маркер академічного стилю.</p>" +
  "<div class='formula'>The figure rose sharply → There was <b>a sharp rise</b> in the figure.<br>" +
  "People consume more energy → <b>energy consumption</b> has increased.<br>" +
  "The government introduced a tax → <b>the introduction</b> of a tax</div>" +
  "<ul>" +
  "<li><b>Task 1:</b> замість «it went up a lot» — a significant increase, a gradual decline, a dramatic fall. Номіналізація + прикметник = точний опис трендів.</li>" +
  "<li><b>Task 2:</b> абстрактні іменники дозволяють формулювати теми: the development of technology, a reduction in crime, the improvement of healthcare.</li>" +
  "</ul>" +
  "<div class='warn'><b>Міра важлива:</b> три номіналізації в одному реченні роблять його важким («the implementation of the reduction of…»). Одна-дві на речення — ідеально.</div>",
  examples:[
    {src:"Task 1 · Trend", en:"There was <span class='hl'>a sharp increase</span> in car ownership between 1990 and 2005.", ru:"Між 1990 і 2005 роками відбулося різке зростання кількості автовласників.", why:"There was a sharp increase in… — базова формула опису трендів замість простого went up."},
    {src:"Task 1 · Comparison", en:"The country experienced <span class='hl'>a gradual decline</span> in birth rates, followed by <span class='hl'>a slight recovery</span>.", ru:"Країна пережила поступове зниження народжуваності, за яким пішло невелике відновлення.", why:"ланцюжок номіналізацій із характеризуючими прикметниками — щільний академічний опис."},
    {src:"Task 2 · Essay", en:"<span class='hl'>The rapid development of</span> artificial intelligence has transformed the labour market.", ru:"Стрімкий розвиток штучного інтелекту трансформував ринок праці.", why:"номіналізація development дозволяє зробити абстрактне явище підметом — основа академічної аргументації."},
    {src:"Task 2 · Essay", en:"<span class='hl'>A reduction in</span> working hours could lead to <span class='hl'>an improvement in</span> employees' mental health.", ru:"Скорочення робочого часу могло б призвести до покращення психічного здоров'я працівників.", why:"a reduction in / an improvement in — готові колокації для причинно-наслідкової аргументації."}
  ],
  exercises:[
    {
      type:"choice", title:"Який варіант академічніший?",
      instruction:"Оберіть формулювання, більш відповідне для IELTS Writing.",
      items:[
        {q:"Task 1, опис зростання:", opts:["The number of tourists went up a lot in 2018.","There was a considerable rise in the number of tourists in 2018."], a:1, why:"went up a lot — розмовне; a considerable rise — номіналізація з точним прикметником."},
        {q:"Task 1, опис падіння:", opts:["Sales dropped dramatically, which was sudden.","The company saw a dramatic drop in sales."], a:1, why:"a dramatic drop in sales — компактна номіналізація замість дієслівної конструкції."},
        {q:"Task 2, вступне речення:", opts:["Because technology develops quickly, jobs change.","The rapid advancement of technology is reshaping the nature of work."], a:1, why:"The rapid advancement of technology — абстрактний підмет робить речення академічним."},
        {q:"Task 2, про наслідки:", opts:["If cities get more crowded, housing will cost more.","Growing urbanisation leads to an increase in housing costs."], a:1, why:"urbanisation / an increase in housing costs — дві коректні номіналізації замість розмовних дієслів."}
      ]
    },
    {
      type:"gap", title:"Перетворіть слово в дужках на іменник",
      instruction:"Впишіть правильну форму іменника. Слідкуйте за правописом.",
      items:[
        {pre:"There was a steady ", post:" in average temperatures over the century. (grow)", acc:["growth"], hint:"grow → іменник на -th", why:"growth — форма, яку часто плутають: grow → growth (не growness)."},
        {pre:"The ", post:" of a new tax on fuel caused public protests. (introduce)", acc:["introduction"], hint:"introduce → introd… + uction", why:"The introduction of… — часта конструкція під час опису урядових заходів."},

        {pre:"A significant ", post:" in air quality has been observed in industrial areas. (worse, дієслово)", acc:["worsening","deterioration"], hint:"потрібен іменник «погіршення»", why:"deterioration / worsening — точні іменники для негативних трендів."}

    {

      items:[
        {src:"The population of the city grew rapidly between 2000 and 2020.", task:"Почніть із There was…", req:[{any:["there was"],hint:"конструкція There was a …"},{any:["growth","increase","rise"],hint:"іменник (growth / increase / rise)"}], model:"There was a rapid growth in the population of the city between 2000 and 2020. / The city saw a rapid population growth between 2000 and 2020.", why:"There was a + прикметник + іменник + in — універсальний шаблон Task 1."},
        {src:"People consume far more sugar than they did fifty years ago.", task:"Почніть із Sugar consumption…", req:[{any:["consumption"],hint:"іменник consumption"}], model:"Sugar consumption has increased significantly over the last fifty years. / Sugar consumption is far higher than it was fifty years ago.", why:"Номіналізація дозволяє зробити явище підметом і описувати його далі."},
        {src:"The government invested heavily in renewable energy, so pollution fell.", task:"Об'єднайте, почавши з Heavy investment…", req:[{any:["investment"],hint:"investment"},{any:["reduction","fall","decrease","decline"],hint:"іменник для падіння забруднення"}], model:"Heavy investment in renewable energy led to a reduction in pollution (levels).", why:"investment in + led to + a reduction in — зв'язка двох номіналізацій показує причину й наслідок в одному реченні."}
      ]

  production:[
    {label:"Task 1", prompt:"Дані: у 2010 році безробіття становило 4%, у 2020 — 11%. Опишіть зміну одним реченням із номіналізацією (There was… / saw a…).", model:"There was a significant rise in unemployment, from 4% in 2010 to 11% in 2020. / The country saw a sharp increase in its unemployment rate over the decade."},
    {label:"Task 2", prompt:"Тема: «Чи варто заборонити автомобілі в центрі міст?» Напишіть речення-тезу з двома номіналізаціями.", model:"The restriction of private cars in city centres would lead to a noticeable improvement in air quality and public health."}
  ]

{
  id:"time", num:4, en:"Clauses of Time", ru:"Підрядні речення часу", tags:["T1","T2"], level:1,
  theory:
  "<p>Підрядні часу задають послідовність подій: <b>when, while, after, before, until, as soon as, once, by the time</b>. У Task 1 вони незамінні для опису етапів процесу та хронології графіків.</p>" +
  "<div class='formula'><b>After</b> the figures peaked, they declined. · <b>Once</b> the mixture has cooled, it is poured into moulds. · <b>By the time</b> the station opened, the line had been extended.</div>" +
  "<ul>" +
  "<li><b>Пунктуація:</b> підрядне на початку речення → кома після нього. Наприкінці — без коми: The figures declined after they peaked.</li>" +
  "<li><b>Майбутній час заборонений</b> після when / after / before / until / as soon as: «When the law <s>will be</s> IS introduced…». Це одна з найпоширеніших помилок!</li>" +
  "<li><b>Once / By the time</b> + Perfect — для строгої послідовності етапів у процесах.</li>" +
  "</ul>" +
  "<div class='warn'><b>While vs During:</b> while + клауза (while sales were falling), during + іменник (during the recession). Не змішуйте: <s>during sales were falling</s>.</div>",
  examples:[
    {src:"Task 1 · Line graph", en:"<span class='hl'>After</span> the figures peaked in 2000, they began a steady decline.", ru:"Після того як показники досягли піку в 2000 році, почалося їхнє стабільне зниження.", why:"хронологія тренда запакована в одне речення замість двох."},
    {src:"Task 1 · Process", en:"<span class='hl'>Once</span> the mixture has cooled, it is poured into moulds and left to harden.", ru:"Як тільки суміш охолола, її розливають у форми й лишають застигати.", why:"Once + Present Perfect — точна послідовність етапів процесу."},
    {src:"Task 1 · Map", en:"<span class='hl'>By the time</span> the new stadium opened, the surrounding roads had been widened.", ru:"До моменту відкриття нового стадіону прилеглі дороги вже були розширені.", why:"By the time + Past Perfect показує, яка зміна сталася раніше — важливо для карт."},
    {src:"Task 2 · Essay", en:"<span class='hl'>When</span> young people enter the job market, practical skills matter more than theoretical knowledge.", ru:"Коли молодь виходить на ринок праці, практичні навички важливіші за теоретичні знання.", why:"узагальнювальне when + Present Simple — природний спосіб почати аргумент."}
  ],
  exercises:[
    {
      type:"choice", title:"Оберіть правильний варіант",
      instruction:"Перевіряйте час дієслова після сполучника та пунктуацію.",
      items:[
        {q:"Task 2, про майбутнє:", opts:["When the new law will be introduced, emissions will fall.","When the new law is introduced, emissions will fall.","When the new law introduced, emissions will fall."], a:1, why:"Після when у значенні майбутнього використовується Present Simple, а не will."},
        {q:"Task 1, процес:", opts:["Before the juice is bottled, it is filtered twice.","Before the juice is bottled it is filtered twice.","Before, the juice is bottled, it is filtered twice."], a:0, why:"Підрядне попереду → одна кома після всього підрядного (…bottled,). Усередині підрядного ком немає."},
        {q:"Яке речення коректне?", opts:["During the price fell, demand increased.","While the price was falling, demand increased.","While the price fell demand, increased."], a:1, why:"While + підрядне з дієсловом; during вимагає іменника (during the fall)."},
        {q:"Task 1, графік:", opts:["As soon as the rate reached 5%, it had started to fall.","As soon as the rate reached 5%, it started to fall.","As soon as the rate will reach 5%, it starts to fall."], a:1, why:"Обидві дії в минулому, одна одразу за іншою: as soon as + Past Simple … Past Simple. Past Perfect тут непотрібен."}
      ]
    },
    {
      type:"gap", title:"Вставте відповідний сполучник часу",
      instruction:"Обирайте з: after, before, until, once, by the time, while, as soon as.",
      items:[
        {pre:"", post:" the survey was conducted, the results were analysed by two independent teams.", acc:["after","once","when"], hint:"спочатку опитування, потім аналіз — сполучник «після того як»", why:"After/Once + Past Simple (або Perfect) для послідовності завершених подій."},
        {pre:"The machine runs ", post:" the temperature reaches a critical level, and then it shuts down automatically.", acc:["until"], hint:"машина працює аж до певного моменту", why:"Until = «доти доки не» — межа дії в часі."},
        {pre:"", post:" the new terminal was opened in 2010, the old one had already been closed for two years.", acc:["by the time"], hint:"одна подія завершилася РАНІШЕ за іншу — «до моменту»", why:"By the time + Past Simple … Past Perfect — показує, що закриття передувало відкриттю."},
        {pre:"", post:" men spent an average of 45 hours per week at work, women spent only 30. (контраст даних на графіку)", acc:["while","whereas"], hint:"сполучник протиставлення двох рядів даних", why:"While/Whereas у значенні контрасту — робоча конячка порівняння в Task 1."}
      ]

    {
      type:"transform", title:"Об'єднайте речення сполучником часу",
      instruction:"Поєднайте пару в одне речення з указаним сполучником.",
      items:[
        {src:"The clay is shaped into bricks. Then the bricks are dried in a kiln.", task:"Використайте once або after", req:[{any:["once","after"],hint:"once / after на початку"},{any:["shaped"],hint:"пасивна форма shaped зберігається"}], model:"Once the clay has been shaped into bricks, they are dried in a kiln. / After the clay is shaped into bricks, they are dried in a kiln.", why:"Once + Present Perfect Passive — еталонна зв'язка етапів процесу."},
        {src:"Oil prices rose sharply in 2008. Immediately afterwards, demand for electric cars grew.", task:"Використайте as soon as або when", req:[{any:["as soon as","when"],hint:"as soon as / when"}], model:"As soon as oil prices rose sharply in 2008, demand for electric cars grew. / When oil prices rose sharply in 2008, demand for electric cars grew.", why:"As soon as підкреслює негайну реакцію одного показника на інший."},
        {src:"Children will leave school at eighteen. They will face a highly competitive job market.", task:"Використайте when (пам'ятайте про заборону will після сполучника!)", req:[{any:["when"],hint:"when"},{any:["leave"],hint:"Present Simple leave замість will leave"}], model:"When children leave school at eighteen, they will face a highly competitive job market.", why:"Will залишається лише в головній частині — у підрядному часу його бути не повинно."}

  production:[
    {label:"Task 1 · Process", prompt:"Опишіть 2 етапи будь-якого процесу (виробництво паперу, фільтрація води), зв'язавши їх через once / after / before.", model:"After the wood chips have been washed, they are pressed into thin sheets. Once the sheets are dry, they are cut to standard sizes."},
    {label:"Task 2", prompt:"Напишіть речення про освіту або технології, почавши з When + Present Simple (без will!).", model:"When students are given more autonomy, they tend to develop stronger problem-solving skills."}
  ]

{
  id:"reason", num:5, en:"Clauses of Reason", ru:"Підрядні речення причини", tags:["T1","T2"], level:1,
  theory:
  "<p>Пояснюємо, <b>чому</b> щось відбувається. Головна відмінність — що стоїть після слова-зв'язки: ціле речення чи іменник.</p>" +
  "<div class='formula'>+ клауза (S + V): <b>because / since / as</b> — Sales fell <b>because</b> costs rose.<br>" +
  "+ іменник: <b>because of / due to / owing to</b> — Sales fell <b>because of</b> rising costs.</div>" +
  "<ul>" +
  "<li><b>As / Since</b> на початку речення звучать формальніше, ніж because: As cities grow, housing becomes scarce.</li>" +
  "<li><b>Due to / owing to</b> ідеально поєднуються з номіналізацією (модуль 3): due to a sharp rise in prices.</li>" +
  "<li><b>Because of</b> — нейтральний, доречний в обох частинах Writing.</li>" +
  "</ul>" +
  "<div class='warn'><b>Типова помилка:</b> «due to» + клауза: <s>The flight was cancelled due to it was foggy</s>. Правильно: due to the fog / because it was foggy. І пам'ятайте: «the reason is because…» — плеоназм, пишіть «the reason is that…».</div>",
  examples:[
    {src:"Task 1 · Chart", en:"Coal consumption fell sharply <span class='hl'>because of a dramatic rise</span> in natural gas production.", ru:"Споживання вугілля різко впало через різке зростання видобутку газу.", why:"because of + номіналізація — два високобальні навички в одному реченні."},
    {src:"Task 2 · Essay", en:"<span class='hl'>As</span> cities become more crowded, affordable housing is increasingly scarce.", ru:"Оскільки міста стають дедалі більш перенаселеними, доступного житла дедалі менше.", why:"As на початку речення — формальний маркер причини, ідеальний для тези."},

        {q:"", opts:["Due to the population is ageing, healthcare costs are rising.","Because the population is ageing, healthcare costs are rising.","Because of the population is ageing, healthcare costs are rising."], a:1, why:"Перед клаузою (the population is ageing) потрібен because/as/since; due to і because of вимагають іменника."},
        {q:"Який початок найформальніший для есе?", opts:["Because of people live longer, pensions are expensive.","As people live longer, pension systems are under pressure.","People live longer, so pensions are expensive."], a:1, why:"As + клауза на початку — формально й точно; so — радше розмовна зв'язка, а because of тут неможливий."},
        {q:"", opts:["The reason for the decline is because of falling demand.","The reason for the decline is that demand has fallen.","The reason for the decline is due to demand fell."], a:1, why:"The reason is that… — єдиний коректний варіант; because/due to після the reason is — плеоназм."}

{
  id:"result", num:6, en:"Clauses of Result", ru:"Підрядні речення наслідку", tags:["T1","T2"], level:2,
  theory:
  "<p>Показуємо, <b>до чого призвела</b> подія. Ключова граматична розвилка — частина мови й пунктуація.</p>" +
  "<div class='formula'><b>so</b> + клауза (сполучник, у середині): Demand rose, <b>so</b> prices increased.<br>" +
  "<b>therefore / consequently / as a result</b> (прислівники!): Demand rose<b>; therefore,</b> prices increased.<br>" +
  "<b>so + adj/adv + that</b>: The cost was <b>so</b> high <b>that</b> the project was abandoned.<br>" +
  "<b>such (a) + noun + that</b>: It was <b>such a</b> sharp rise <b>that</b> supplies ran out.<br>" +
  "<b>thereby + V-ing</b>: Taxes were cut, <b>thereby boosting</b> consumption.</div>" +
  "<ul>" +
  "<li><b>Therefore / consequently</b> — НЕ сполучники. Між двома клаузами потрібна крапка з комою або крапка: <s>Demand rose, therefore prices increased</s> — коми замало!</li>" +
  "<li><b>Thereby + -ing</b> — елегантна зв'язка результату, поєднує наслідок із дієприкметниковим зворотом (модуль 1).</li>" +
  "</ul>" +
  "<div class='warn'><b>So vs so that:</b> so = «тому» (результат), so that = «щоб» (мета, модуль 7). The tax was raised so that revenue would grow — мета; revenue grew, so the tax was cut — результат.</div>",
  examples:[
    {src:"Task 1 · Chart", en:"Demand for electric cars rose sharply<b>;</b> <span class='hl'>consequently,</span> manufacturers expanded production.", ru:"Попит на електромобілі різко зріс; отже, виробники розширили виробництво.", why:"крапка з комою + consequently + кома — зразкова пунктуація прислівника-конектора."},
    {src:"Task 2 · Essay", en:"The cost of the project was <span class='hl'>so high that</span> the government had to abandon it.", ru:"Вартість проєкту була настільки високою, що уряд мусив від нього відмовитися.", why:"so + adjective + that — виразна конструкція результату для Band 7+."},
    {src:"Task 1 · Trend", en:"The government lowered interest rates, <span class='hl'>thereby stimulating</span> consumer spending.", ru:"Уряд знизив процентні ставки, стимулюючи тим самим споживчі витрати.", why:"thereby + V-ing об'єднує причину й результат в одне речення без сполучників."},
    {src:"Task 2 · Essay", en:"Air travel has become <span class='hl'>such an</span> affordable option <span class='hl'>that</span> overseas holidays are no longer a luxury.", ru:"Авіаперельоти стали настільки доступними, що відпочинок за кордоном більше не розкіш.", why:"such + a/an + noun + that — пара до so + adjective + that, урізноманітнює текст."}
  ],
  exercises:[
    {
      type:"choice", title:"Пунктуація та вибір зв'язки",
      instruction:"Лише один варіант у кожному рядку оформлений правильно.",
      items:[
        {q:"", opts:["Tuition fees increased, therefore fewer students could afford university.","Tuition fees increased; therefore, fewer students could afford university.","Tuition fees increased therefore, fewer students could afford university."], a:1, why:"Therefore — прислівник: перед ним крапка з комою (або крапка), після — кома."},
        {q:"", opts:["The price of fuel rose, so transport costs went up.","The price of fuel rose; so, transport costs went up.","The price of fuel rose. So, transport costs went up."], a:0, why:"So — сполучник: ставиться в середині після коми. Варіант 3 допустимий у неформальному стилі, але в IELTS краще сполучникове so після коми."},
        {q:"", opts:["The rise was so sharp that supplies ran out.","The rise was so sharp, that supplies ran out.","The rise was such sharp that supplies ran out."], a:0, why:"So + adjective + that без коми; such вимагає іменника (such a sharp rise)."},
        {q:"", opts:["It was such rapid growth that the infrastructure could not cope.","It was such a rapid growth that the infrastructure could not cope.","It was so a rapid growth that the infrastructure could not cope."], a:1, why:"Such + a + adjective + countable noun + that. Артикль a обов'язковий перед злічуваним іменником."}
      ]
    },
    {
      type:"gap", title:"Вставте so, such, therefore, consequently або thereby",
      instruction:"Дивіться на пунктуацію та на те, що йде за пропуском.",
      items:[
        {pre:"Online shopping has grown enormously; ", post:", many physical stores have closed.", acc:["consequently","therefore"], hint:"після крапки з комою потрібен прислівник-конектор із комою", why:"; consequently, — зразкове оформлення прислівника наслідку."},
        {pre:"Housing in the capital is ", post:" expensive that young families are moving to the suburbs.", acc:["so"], hint:"перед прикметником — одне коротке слово", why:"so + adjective + that."},
        {pre:"The company introduced automation, ", post:" reducing its labour costs by 30%.", acc:["thereby"], hint:"слово перед -ing формою, що означає «тим самим»", why:"thereby + V-ing — зв'язка результату з дієприкметниковим зворотом."},
        {pre:"It was ", post:" a severe drought that the harvest was almost completely lost.", acc:["such"], hint:"перед a + adjective + noun", why:"such a + adjective + noun + that."}
      ]
    },
    {
      type:"transform", title:"Об'єднайте, виразивши наслідок",
      instruction:"Поєднайте пару речень указаним способом.",
      items:[
        {src:"Internet access expanded rapidly in rural areas. Small businesses gained new markets.", task:"Використайте therefore або consequently (з правильною пунктуацією!)", req:[{any:["therefore","consequently"],hint:"therefore / consequently"},{any:[";","."],hint:"крапка з комою або крапка перед прислівником"}], model:"Internet access expanded rapidly in rural areas; consequently, small businesses gained new markets. / Internet access expanded rapidly in rural areas. Therefore, small businesses gained new markets.", why:"Перевіряємо і зв'язку, і пунктуацію — обидві помилки трапляються однаково часто."},
        {src:"The new highway reduced journey times. This boosted trade between the two cities.", task:"Використайте thereby + V-ing", req:[{any:["thereby"],hint:"thereby"},{any:["boosting"],hint:"-ing форма дієслова boost"}], model:"The new highway reduced journey times, thereby boosting trade between the two cities.", why:"Одне речення замість двох — щільність тексту зростає, слів стає менше."},
        {src:"The exam was extremely difficult. Only ten percent of the candidates passed.", task:"Використайте so…that", req:[{any:["so"],hint:"so перед прикметником"},{any:["that"],hint:"that після прикметника"}], model:"The exam was so difficult that only ten percent of the candidates passed.", why:"so + adjective + that — посилює аргумент і показує контроль складної структури."}
      ]
    }
  ],
  production:[
    {label:"Task 1", prompt:"Ціни на житло зросли на 40% за п'ять років. Наслідок — попит на оренду зріс. Опишіть одним реченням (therefore / thereby / so…that).", model:"House prices rose by 40% in five years; consequently, demand for rental property increased. / House prices rose so sharply that demand for rental property surged."},
    {label:"Task 2", prompt:"Тема: «Вплив соцмереж на підлітків». Напишіть речення з so + adjective + that або such + noun + that.", model:"Social media has become such an integral part of teenagers' lives that limiting its use requires joint efforts from parents and schools."}
  ]
},
{
  id:"purpose", num:7, en:"Clauses of Purpose", ru:"Підрядні речення мети", tags:["T2"], level:2,
  theory:
  "<p>Пояснюємо, <b>навіщо</b> щось робиться. Вибір конструкції залежить від того, що йде далі — інфінітив чи ціле речення.</p>" +
  "<div class='formula'>+ інфінітив: <b>to / in order to / so as to</b> — invest in transport <b>to reduce</b> congestion.<br>" +
  "+ клауза: <b>so that</b> + S + V — invest in transport <b>so that</b> commuters can save time.<br>" +
  "заперечення: <b>in order not to / so as not to</b> — <b>so as not to</b> discourage students.</div>" +
  "<ul>" +
  "<li><b>In order to / so as to</b> — формальніші за простий to, ідеальні для Task 2 (речення-рішення, рекомендації).</li>" +
  "<li><b>So that</b> обов'язковий, коли в мети інший підмет: The school extended the library hours so that students could study after classes (мету виконують students, а не school).</li>" +
  "<li><b>For + noun / V-ing:</b> a scheme for reducing waste — теж спосіб виразити мету, часто з номіналізацією.</li>" +
  "</ul>" +
  "<div class='warn'><b>Типова помилка:</b> «for to + V»: <s>They built a shelter for to protect animals</s>. Правильно: to protect / in order to protect. Ще: після so that зазвичай стоїть модальне дієслово (can/could/will/would), а не теперішній час.</div>",
  examples:[
    {src:"Task 2 · Solution", en:"Governments should invest in public transport <span class='hl'>in order to reduce</span> urban congestion.", ru:"Урядам слід вкладатися в громадський транспорт, щоб зменшити затори.", why:"in order to + інфінітив — класична формула речення-рішення в problem/solution есе."},
    {src:"Task 2 · Essay", en:"Some parents limit screen time <span class='hl'>so that</span> their children <span class='hl'>can</span> concentrate on schoolwork.", ru:"Деякі батьки обмежують екранний час, щоб діти могли зосередитися на навчанні.", why:"so that + can — мета з іншим підметом; простий to тут неможливий."},
    {src:"Task 2 · Essay", en:"The curriculum should be designed <span class='hl'>so as not to overload</span> younger pupils.", ru:"Програму слід складати так, щоб не перевантажувати молодших школярів.", why:"so as not to — рідкісна заперечна форма мети, виділяє відповідь."},
    {src:"Task 1 · Process", en:"The liquid is cooled rapidly <span class='hl'>in order to prevent</span> crystallisation.", ru:"Рідину швидко охолоджують, щоб запобігти кристалізації.", why:"мета етапу процесу — в Task 1 діаграм такі пояснення показують розуміння процесу."}
  ],
  exercises:[
    {
      type:"choice", title:"Оберіть правильну конструкцію мети",
      instruction:"Дивіться, що стоїть після зв'язки — інфінітив чи клауза.",
      items:[
        {q:"", opts:["The city built bike lanes for to encourage cycling.","The city built bike lanes to encourage cycling.","The city built bike lanes for encourage cycling."], a:1, why:"Просто to + інфінітив; for to — груба помилка."},
        {q:"У мети інший підмет:", opts:["The school hired counsellors to students could cope with stress.","The school hired counsellors so that students could cope with stress.","The school hired counsellors in order to students cope with stress."], a:1, why:"Різні підмети (school / students) → потрібен so that + клауза з модальним дієсловом."},
        {q:"Заперечна мета:", opts:["The rules were simplified in order not to confuse applicants.","The rules were simplified in order to not confuse applicants.","The rules were simplified for not to confuse applicants."], a:0, why:"Заперечення ставиться перед to: in order NOT to / so as NOT to."},
        {q:"Найформальніший варіант:", opts:["More trees were planted to make the air cleaner.","More trees were planted in order to improve air quality.","More trees were planted so the air is cleaner."], a:1, why:"in order to + точна лексика (improve air quality) — формально; so без that і make…cleaner звучать розмовно."}
      ]
    },
    {
      type:"gap", title:"Вставте зв'язку мети",
      instruction:"Обирайте з: to, in order to, so as to, so that, in order not to, so as not to, for.",
      items:[
        {pre:"Cameras were installed in the city centre ", post:" deter crime.", acc:["to","in order to","so as to"], hint:"далі інфінітив; найформальніший — два слова", why:"in order to + V — формальна мета, типова для теми crime."},
        {pre:"The course includes practical sessions ", post:" students can apply theory to real cases.", acc:["so that"], hint:"далі ціле речення з підметом students", why:"Інший підмет → so that + can/could."},
        {pre:"Speed limits were lowered ", post:" reduce the number of accidents.", acc:["to","in order to","so as to"], hint:"інфінітив reduce", why:"Будь-який з інфінітивних варіантів правильний; in order to — найформальніший."},
        {pre:"The announcement was made quietly ", post:" cause panic among passengers.", acc:["in order not to","so as not to"], hint:"потрібне заперечення: «щоб не»", why:"in order not to / so as not to — заперечення перед інфінітивом."}
      ]
    },
    {
      type:"transform", title:"Об'єднайте, виразивши мету",
      instruction:"Поєднайте речення, використовуючи вказану конструкцію.",
      items:[
        {src:"The government subsidises electric cars. Its goal is to cut carbon emissions.", task:"Використайте in order to", req:[{any:["in order to"],hint:"in order to"},{any:["cut","reduce"],hint:"інфінітив cut/reduce"}], model:"The government subsidises electric cars in order to cut carbon emissions.", why:"Типова структура речення-рішення в Task 2: захід + in order to + мета."},
        {src:"Universities should offer more online courses. Then working adults can continue their education.", task:"Використайте so that", req:[{any:["so that"],hint:"so that"},{any:["can","could","will be able"],hint:"модальне дієслово після so that"}], model:"Universities should offer more online courses so that working adults can continue their education.", why:"Підмети різні (universities / adults) → тільки so that."},
        {src:"The filters remove impurities. Their purpose is to make the water safe to drink.", task:"Використайте to або in order to (контекст — процес, Task 1)", req:[{any:["in order to"," to make"],hint:"to / in order to + make"}], model:"The filters remove impurities (in order) to make the water safe to drink.", why:"Пояснення мети етапу показує екзаменатору, що ви розумієте процес, а не просто перелічуєте кроки."}

  ],
  production:[
    {label:"Task 2 · Problem/Solution", prompt:"Проблема: затори в містах. Запропонуйте захід і його мету одним реченням (in order to / so that).", model:"Cities should introduce congestion charges in order to discourage unnecessary car use. / Metro networks should be expanded so that commuters can reach the centre without driving."},
    {label:"Task 2 · Заперечна мета", prompt:"Напишіть речення про шкільні іспити з in order not to / so as not to.", model:"Assessment methods should be varied so as not to discourage students who struggle with traditional exams."}
  ]
},
{
  id:"concession", num:8, en:"Clauses of Concession", ru:"Підрядні речення уступки", tags:["T1","T2"], level:2,
  theory:
  "<p>Уступка визнає протилежний факт або аргумент — і одразу його «переважує». Це ядро контраргументації в Task 2 та порівняння даних у Task 1.</p>" +
  "<div class='formula'>+ клауза: <b>although / even though / though / while / whereas</b><br>" +
  "+ іменник: <b>despite / in spite of</b> — <b>Despite</b> the high cost, the project continued.<br>" +
  "прислівник-конектор: <b>however / nevertheless</b> (окреме речення!)</div>" +
  "<ul>" +
  "<li><b>Even though</b> сильніше, ніж although — «хоча й», «незважаючи на те що».</li>" +
  "<li><b>Whereas / while</b> — пряме протиставлення двох фактів: Whereas men spent 45 hours at work, women spent 30. Незамінне в Task 1.</li>" +
  "<li><b>Despite / in spite of</b> + noun або + the fact that…: despite the rise / despite the fact that prices rose.</li>" +
  "</ul>" +
  "<div class='warn'><b>Дві головні помилки:</b> 1) although + but в одному реченні (<s>Although it rained, but we left</s>) — обирайте щось одне. 2) however як сполучник: <s>The cost was high, however the project continued</s> — потрібна крапка з комою: The cost was high; however, the project continued.</div>",
  examples:[

{
  id:"inversion", num:9, en:"Inversion", ru:"Інверсія для акценту", tags:["T2"], level:3,
  theory:
  "<p>Інверсія — зворотний порядок слів (допоміжне дієслово перед підметом) після винесених на початок заперечних або обмежувальних прислівників. Це <b>одна з найрідкісніших структур</b> у письмі кандидатів — і тому потужний маркер Band 8+.</p>" +
  "<div class='formula'><b>Never / Rarely / Seldom</b> + aux + S + V — <b>Rarely do</b> governments consider…<br>" +
  "<b>Not only</b> + aux + S + V … <b>but also</b> — <b>Not only does</b> tourism create jobs, <b>but</b> it <b>also</b> promotes exchange.<br>" +
  "<b>Only when / Only after</b> + клауза, aux + S + V — <b>Only when</b> consumption falls <b>will</b> emissions <b>decrease</b>.<br>" +
  "<b>Under no circumstances</b> + aux + S + V — <b>Under no circumstances should</b> children be given…<br>" +
  "<b>Hardly / Scarcely</b> … <b>when</b>; <b>No sooner</b> … <b>than</b></div>" +
  "<ul>" +
  "<li>Інверсія відбувається <b>в головній частині</b>, а не в підрядній: Only when the law changes WILL people comply (а не <s>only when will the law change</s>).</li>" +
  "<li>Якщо в реченні немає допоміжного дієслова — додайте <b>do/does/did</b>: Rarely DO we consider…</li>" +
  "<li>Однієї-двох інверсій на есе достатньо; більше — забагато.</li>" +
  "</ul>" +
  "<div class='warn'><b>Де використовувати:</b> переважно Task 2 — для сильних тез, рекомендацій, висновку. У Task 1 (опис даних) інверсія зазвичай недоречна.</div>",
  examples:[
    {src:"Task 2 · Essay", en:"<span class='hl'>Not only does</span> tourism create employment, <span class='hl'>but</span> it <span class='hl'>also</span> promotes cultural exchange.", ru:"Туризм не лише створює робочі місця, а й сприяє культурному обміну.", why:"Not only… but also з інверсією — два аргументи в одній ефектній конструкції."},
    {src:"Task 2 · Opinion", en:"<span class='hl'>Rarely do</span> policymakers consider the long-term consequences of urban expansion.", ru:"Політики рідко враховують довгострокові наслідки зростання міст.", why:"Rarely + do + subject — критика звучить сильніше й формальніше."},
    {src:"Task 2 · Conclusion", en:"<span class='hl'>Only when</span> governments, businesses and citizens act together <span class='hl'>will</span> climate change <span class='hl'>be</span> reversed.", ru:"Лише коли уряди, бізнес і громадяни діятимуть разом, зміну клімату можна буде повернути.", why:"ідеальна формула сильного висновку: умова + інвертований результат."},
    {src:"Task 2 · Recommendation", en:"<span class='hl'>Under no circumstances should</span> children under thirteen be given unrestricted access to social media.", ru:"Ні в якому разі дітям до тринадцяти не можна давати необмежений доступ до соцмереж.", why:"Under no circumstances + should — категорична рекомендація, найвищий рівень формальності."}
  ],
  exercises:[
    {
      type:"choice", title:"Оберіть речення з правильною інверсією",
      instruction:"Перевіряйте порядок слів: aux + підмет + смислове дієслово — і де саме відбувається інверсія.",
      items:[
        {q:"", opts:["Not only exercise improves health, but it also reduces stress.","Not only does exercise improve health, but it also reduces stress.","Not only improves exercise health, but it also reduces stress."], a:1, why:"Немає допоміжного → додаємо does; смислове дієслово повертається до інфінітива: does…improve."},
        {q:"", opts:["Only when the law is enforced, people will comply.","Only when will the law be enforced, people will comply.","Only when the law is enforced will people comply."], a:2, why:"Інверсія — в головній частині (will people comply); у підрядній після only when порядок прямий, і кома після підрядної."},
        {q:"", opts:["Under no circumstances personal data should be shared.","Under no circumstances should personal data be shared.","Under no circumstances should be personal data shared."], a:1, why:"Under no circumstances + should + S (personal data) + be shared."},
        {q:"", opts:["No sooner had the measure been introduced than prices stabilised.","No sooner the measure had been introduced than prices stabilised.","No sooner had the measure been introduced when prices stabilised."], a:0, why:"No sooner + Past Perfect (had + S + V3) … than. Пара до scarcely/hardly…when."}
      ]
    },
    {
      type:"gap", title:"Добудуйте інверсію",
      instruction:"Впишіть бракуюче допоміжне дієслово або слово зв'язки.",
      items:[
        {pre:"Rarely ", post:" such an opportunity arise in a person's lifetime. (впишіть допоміжне дієслово)", acc:["does"], hint:"підмет opportunity — 3-тя особа однини, теперішній час", why:"Rarely + does + S + V (інфінітив arise)."},
        {pre:"Not only ", post:" renewable energy reduce emissions, but it also creates jobs.", acc:["does"], hint:"допоміжне дієслово для 3-ї особи", why:"Not only does + S + V … but … also."},
        {pre:"Only by working together ", post:" we overcome global challenges.", acc:["can","will"], hint:"модальне дієслово перед підметом we", why:"Only by… + can/will + S + V — інверсія в головній частині."},
        {pre:"Hardly had the results been published ", post:" the debate began.", acc:["when"], hint:"парний сполучник до hardly/scarcely", why:"Hardly/Scarcely + had + S + V3 … when. (No sooner…than — не переплутайте!)"}
      ]
    },
    {
      type:"transform", title:"Перепишіть з інверсією",
      instruction:"Збережіть зміст, посильте акцент указаною конструкцією.",
      items:[
        {src:"Public libraries are valuable not just as sources of books, but also as community centres.", task:"Почніть з Not only…", req:[{any:["not only"],hint:"Not only на початку"},{any:["are","do"],hint:"інверсія: допоміжне дієслово перед підметом (not only are libraries…)"},{any:["but also","but they are also","but"],hint:"друга частина — but (also)"}], model:"Not only are public libraries valuable sources of books, but they are also community centres. / Not only do public libraries provide books, but they also serve as community centres.", why:"Not only + інверсія — і два аргументи, і рідкісна структура водночас."},
        {src:"We will not solve the housing crisis until the government changes its policy.", task:"Почніть з Not until…", req:[{any:["not until"],hint:"Not until на початку"},{any:["will"],hint:"інверсія з will у головній частині"}], model:"Not until the government changes its policy will we solve the housing crisis. / Not until the policy changes will the housing crisis be solved.", why:"Not until + клауза (прямий порядок!), потім will + S + V."},
        {src:"Voting should never be made compulsory.", task:"Почніть з Under no circumstances…", req:[{any:["under no circumstances"],hint:"Under no circumstances"},{any:["should"],hint:"should перед підметом"}], model:"Under no circumstances should voting be made compulsory.", why:"Готова формула категоричної відмови — запам'ятайте її цілком."}
      ]
    }
  ],
  production:[
    {label:"Task 2 · Сильна теза", prompt:"Тема: «Важливість мистецтва в шкільній програмі». Напишіть речення з Not only… but also.", model:"Not only does art education develop creativity, but it also improves academic performance in other subjects."},
    {label:"Task 2 · Висновок", prompt:"Напишіть фінальне речення есе про екологію з Only when / Only if + інверсія.", model:"Only when economic growth is decoupled from environmental damage will true sustainability be achieved."}
  ]
},
{
  id:"cleft", num:10, en:"Cleft Sentences", ru:"Розчленовані речення", tags:["T2"], level:3,
  theory:
  "<p>Розчленоване речення «розрізає» просту думку на дві частини, щоб <b>поставити у фокус</b> найважливіше. Це інструмент емфази — ви керуєте увагою читача.</p>" +
  "<div class='formula'><b>It is/was … that/who …</b> — <b>It is</b> education <b>that</b> drives progress.<br>" +
  "<b>What … is/was …</b> — <b>What</b> drives progress <b>is</b> education.<br>" +
  "<b>What + S + V + is/was + to-inf / noun</b> — What governments should do <b>is invest</b> in schools.<br>" +
  "<b>The reason (why) … is that …</b> · <b>The place/person/thing …</b></div>" +
  "<ul>" +
  "<li><b>It-cleft</b> виділяє один елемент: It was the 1990s that saw the steepest rise (не технології, не політика — саме 1990-ті).</li>" +
  "<li><b>Wh-cleft (pseudo-cleft)</b> з What — улюблена структура для вступів і висновків: What matters most is… / What concerns me is…</li>" +
  "<li>Інформація після is/that — <b>нова й головна</b>; решта сприймається як тло.</li>" +
  "</ul>" +
  "<div class='warn'><b>Не зловживайте:</b> одне розчленоване речення на есе справляє враження; три — дратують. І стежте за that/who: для людей — who, для решти — that (which у cleft не використовується).</div>",
  examples:[
    {src:"Task 2 · Opinion", en:"<span class='hl'>It is</span> early childhood education <span class='hl'>that</span> has the greatest long-term impact on a person's life.", ru:"Саме дошкільна освіта має найбільший довгостроковий вплив на життя людини.", why:"It-cleft виділяє один пріоритет із багатьох — сильна теза."},
    {src:"Task 2 · Essay", en:"<span class='hl'>What</span> governments often overlook <span class='hl'>is</span> the role of public transport in reducing inequality.", ru:"Те, що уряди часто випускають з уваги, — це роль громадського транспорту у зменшенні нерівності.", why:"What-cleft створює інтригу: спочатку «щось випускають», потім — що саме."},
    {src:"Task 2 · Conclusion", en:"<span class='hl'>What</span> societies should invest in <span class='hl'>is</span> not stricter punishment but better rehabilitation.", ru:"У що суспільствам слід інвестувати — не в суворіші покарання, а в кращу реабілітацію.", why:"What…is not X but Y — ефектна формула для висновку з протиставленням."},
    {src:"Task 1 · Graph (рідко, але ефектно)", en:"<span class='hl'>It was in 2008 that</span> sales reached their highest point.", ru:"Саме в 2008 році продажі досягли піку.", why:"It was…that виділяє ключовий рік на графіку — доречно один раз в огляді."}
  ],
  exercises:[
    {
      type:"choice", title:"Оберіть коректне розчленоване речення",
      instruction:"Перевіряйте сполучне слово (that/who, не which!) та узгодження.",
      items:[
        {q:"", opts:["It is the younger generation which drives technological change.","It is the younger generation that drives technological change.","It is the younger generation what drives technological change."], a:1, why:"У cleft-конструкції використовується that (для людей можливо who); which і what тут неможливі."},
        {q:"", opts:["What concerns most parents it is screen time.","What concerns most parents is screen time.","What concerns most parents, it is screen time."], a:1, why:"What-клауза + is + фокус, без зайвого it і без коми."},
        {q:"", opts:["What the city needs are more affordable houses.","What the city needs is more affordable housing.","What the city needs it is more affordable housing."], a:1, why:"Після what-cleft традиційно is (housing тут незлічуваний, тож однозначно is); зайве it неприпустиме."},
        {q:"", opts:["It was after the war when the district was rebuilt.","It was after the war that the district was rebuilt.","It was after the war, that the district was rebuilt."], a:1, why:"It was…that, без коми й без when — that універсальний навіть для часу."}
      ]
    },
    {
      type:"gap", title:"Вставте It / What / that / is / was",
      instruction:"Відновіть розчленовану конструкцію.",
      items:[
        {pre:"", post:" is the lack of funding that prevents schools from hiring enough teachers.", acc:["it"], hint:"It-cleft: __ is the lack of funding that…", why:"It is … that … — фокус на the lack of funding."},
        {pre:"What makes this trend worrying ", post:" its effect on children's attention spans.", acc:["is"], hint:"What… + дієслово-зв'язка", why:"What-cleft: What … is …"},
        {pre:"It was the invention of the smartphone ", post:" transformed how people consume news.", acc:["that"], hint:"сполучне слово після It was…", why:"It was … that … — не when, не which."},
        {pre:"", post:" the report emphasises is the need for immediate action.", acc:["what"], hint:"Wh-cleft на початку речення", why:"What the report emphasises is… — фокус на головній рекомендації."}
      ]
    },
    {
      type:"transform", title:"Поставте елемент у фокус",
      instruction:"Перепишіть речення як cleft, виділивши вказану в завданні частину.",
      items:[
        {src:"Social media has changed political campaigns more than anything else.", task:"Фокус — social media; використайте It is…that", req:[{any:["it is"],hint:"It is на початку"},{any:["that"],hint:"that після фокусу"}], model:"It is social media that has changed political campaigns more than anything else.", why:"It-cleft каже: змінили кампанії не гроші й не телебачення, а саме соцмережі."},
        {src:"Governments should invest in teacher training, not in new buildings.", task:"Використайте What…is… not…but…", req:[{any:["what"],hint:"What на початку"},{any:["is"],hint:"is після what-клаузи"}], model:"What governments should invest in is teacher training, not new buildings. / What governments should do is invest in teacher training rather than new buildings.", why:"What…is… — класична рамка для рекомендації з протиставленням."},
        {src:"The main reason for the decline in reading is the competition from digital entertainment.", task:"Фокус — the competition from digital entertainment; почніть з It is", req:[{any:["it is"],hint:"It is"},{any:["that"],hint:"that"}], model:"It is the competition from digital entertainment that is the main reason for the decline in reading.", why:"Cleft дозволяє перевернути нудне «the reason is» на акцентоване твердження."}
      ]
    }
  ],
  production:[
    {label:"Task 2 · Вступ", prompt:"Напишіть перше речення есе про важливість іноземних мов з What…is…", model:"What makes foreign language skills indispensable today is the global nature of the modern job market."},
    {label:"Task 2 · Аргумент", prompt:"Тема: «Хто відповідає за екологію — люди чи корпорації?» Виділіть винуватця з It is…that…", model:"It is large corporations, rather than individual consumers, that bear the greatest responsibility for environmental protection."}
  ]
},
{
  id:"conditionals", num:11, en:"Mixed Conditionals", ru:"Змішані умовні речення", tags:["T2"], level:3,
  theory:
  "<p>Змішані умовні поєднують <b>різні часи</b> в одній гіпотезі: умова з минулого впливає на теперішнє — або навпаки. У Task 2 це інструмент для оцінки альтернатив і наслідків.</p>" +
  "<div class='formula'><b>Минуле → теперішнє:</b> If + Past Perfect, … would + V —<br>If governments <b>had invested</b> in railways, congestion <b>would be</b> lower today.<br><br>" +
